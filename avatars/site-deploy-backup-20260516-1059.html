    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,224,0.04) 1px, transparent 1px),

      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(60px); }
    }

    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      position: relative;

    .brand::after {

      -webkit-background-clip: text;

      background-clip: text;

      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--neon);
      margin-bottom: 0.8rem;
      opacity: 0.8;
    }

    .video-frame {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0,255,224,0.2);
      box-shadow:
        0 0 40px rgba(0,255,224,0.08),
        0 0 80px rgba(0,255,224,0.04),
        inset 0 0 20px rgba(0,255,224,0.03);
      background: #0a0a0f;
    }

    .video-frame video {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    /* Corner accents */
    .video-frame::before,
    .video-frame::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 2;
      pointer-events: none;
    }
    .video-frame::before {
      top: 0; left: 0;
      border-top: 2px solid var(--neon);
      border-left: 2px solid var(--neon);
      border-radius: 12px 0 0 0;
    }
    .video-frame::after {
      bottom: 0; right: 0;
      border-bottom: 2px solid var(--neon);
      border-right: 2px solid var(--neon);
      border-radius: 0 0 12px 0;
    }

    .soon-badge {

      gap: 0.6rem;

      color: var(--neon);

      letter-spacing: 0.25em;

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon);
