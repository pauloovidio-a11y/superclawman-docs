<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>if(location.hostname==='www.superclawman.ai')location.replace('https://superclawman.ai'+location.pathname+location.search+location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — SuperClawman</title>
  <meta name="description" content="That page doesn't exist on superclawman.ai." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" sizes="256x256" href="https://pauloovidio-a11y.github.io/superclawman-docs/avatars/web/superclawman-256.png" />
  <link rel="apple-touch-icon" href="https://pauloovidio-a11y.github.io/superclawman-docs/avatars/web/superclawman-256.png" />
  <style>
:root{
  --ground:#0a0a0c;
  --ground-2:#131316;
  --panel:#111114;
  --panel-hi:#1a1a1f;
  --ink:rgba(255,255,255,.92);
  --ink-dim:rgba(255,255,255,.62);
  --ink-mute:rgba(255,255,255,.54);
  --ink-faint:rgba(255,255,255,.30);
  --ink-hair:rgba(255,255,255,.13);
  --grid-major:rgba(255,255,255,.10);
  --grid-minor:rgba(255,255,255,.038);
  --amber:#ffb000;
  --amber-dim:rgba(255,176,0,.55);
  --mono:'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--ground);
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid-minor) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  background-attachment:fixed;
  line-height:1.6;
  font-weight:300;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber);color:var(--ground-2)}
a{color:inherit}

.sheet-frame{position:fixed;inset:10px;border:1.5px solid var(--ink-faint);pointer-events:none;z-index:60}
.sheet-frame::before,.sheet-frame::after{content:"";position:absolute;background:var(--ink-faint)}
.sheet-frame::before{left:-1.5px;top:50%;width:8px;height:1.5px}
.sheet-frame::after{right:-1.5px;top:50%;width:8px;height:1.5px}
.frame-tick{position:absolute;font-family:var(--mono);font-size:9px;color:var(--ink-faint);letter-spacing:.1em;white-space:nowrap}
.frame-tick.t{top:2px;left:50%;transform:translateX(-50%)}
.frame-tick.b{bottom:2px;left:50%;transform:translateX(-50%)}
@media(max-width:1023px){.frame-tick.b{display:none}}
@media(max-width:767px){.sheet-frame{display:none}}

.wrap{width:100%;max-width:660px;text-align:center}

.code{
  font-family:var(--mono);
  font-size:clamp(72px,18vw,148px);
  font-weight:300;
  line-height:1;
  letter-spacing:.04em;
  color:var(--amber);
  display:block;
}
.rule{height:1px;background:var(--ink-hair);margin:26px auto;max-width:340px}
h1{
  font-family:var(--mono);
  font-size:clamp(15px,3.4vw,19px);
  font-weight:400;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--ink);
}
p.lede{
  margin:16px auto 0;
  max-width:440px;
  font-size:15px;
  color:var(--ink-dim);
}

.links{
  margin-top:36px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.links a{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--ink-dim);
  border:1px solid var(--ink-hair);
  background:var(--panel);
  padding:11px 16px;
  transition:border-color .18s ease,color .18s ease,background .18s ease;
}
.links a:hover{border-color:var(--amber-dim);color:var(--ink);background:var(--panel-hi)}
.links a.primary{border-color:var(--amber-dim);color:var(--amber)}
.links a.primary:hover{background:var(--amber);color:var(--ground)}

.langs{
  margin-top:28px;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.1em;
  color:var(--ink-mute);
}
.langs a{text-decoration:none;border-bottom:1px solid var(--ink-hair);padding-bottom:1px}
.langs a:hover{color:var(--ink);border-color:var(--amber-dim)}
.langs span{opacity:.4;padding:0 8px}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="sheet-frame" aria-hidden="true">
    <span class="frame-tick t">SUPERCLAWMAN · SHEET E-404 · EN</span>
    <span class="frame-tick b">SCALE 1:1 · REV 2026.08</span>
  </div>

  <main class="wrap">
    <span class="code">404</span>
    <div class="rule"></div>
    <h1>Page not found</h1>
    <p class="lede">That address doesn't exist on superclawman.ai. It may have moved, or the link that brought you here is out of date.</p>

    <nav class="links">
      <a class="primary" href="/">Home</a>
      <a href="/meetings">Meetings</a>
      <a href="/whatsapp-memory">WhatsApp Memory</a>
      <a href="/business">Business</a>
    </nav>

    <div class="langs">
      <a href="/pt">Português</a><span>·</span><a href="/es">Español</a>
    </div>
  </main>
</body>
</html>
